<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  
  <!-- Fontes do Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600&display=swap" rel="stylesheet">

  <style>
    /* CSS Otimizado e Enxuto */
    app-login {
      --red: #AD1F23;
      --red-hover: #8f191d;
      --black: #000000;
      --white: #FFFFFF;
      --gray: #F4F6F9;
      --text-muted: #555a62;
      --border-color: #dfe3e8;
      --font-title: "Montserrat", "Segoe UI", Arial, sans-serif;
      --font-sans: "Inter", "Segoe UI", Arial, sans-serif;

      display: block;
      width: 100%;
      min-height: 100vh;
      background: var(--gray);
      color: var(--black);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
    }

    app-login *, app-login *::before, app-login *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    app-login a { color: inherit; text-decoration: none; }
    app-login button { font-family: inherit; cursor: pointer; }

    app-login a:focus-visible, app-login button:focus-visible, app-login input:focus-visible {
      outline: 3px solid var(--red);
      outline-offset: 2px;
    }

    /* Layout */
    app-login .login {
      display: grid;
      grid-template-columns: 5fr 7fr;
      min-height: 100vh;
    }

    app-login .login__image {
      position: relative;
      background: #e4e8f0;
    }

    app-login .login__image img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    app-login .login__panel {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
    }

    app-login .login__box {
      width: 100%;
      max-width: 440px;
    }

    /* Elementos de Texto */
    app-login .back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 600;
      color: var(--black);
    }
    app-login .back:hover { text-decoration: underline; text-underline-offset: 4px; }

    app-login h1 {
      margin-top: 20px;
      font-family: var(--font-title);
      font-size: 36px;
      font-weight: 600;
      line-height: 1.2;
      color: #111;
    }

    app-login .login__sub, app-login .login__signup {
      font-size: 15px;
      line-height: 22px;
      color: var(--text-muted);
    }

    /* Formulário */
    app-login .form { margin-top: 19px; }
    app-login .field + .field { margin-top: 20px; }

    app-login label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: var(--black);
    }

    app-login .field > label, app-login .field__row { margin-bottom: 6px; }

    app-login .field__row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    app-login .field__row label { margin: 0; }

    app-login .esqueci-senha-link {
      cursor: pointer;
      color: var(--red);
      font-size: 13px;
      font-weight: 600;
    }
    app-login .esqueci-senha-link:hover { text-decoration: underline; color: var(--red-hover); }

    app-login input {
      display: block;
      width: 100%;
      height: 47px;
      padding: 0 15px;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      background: var(--white);
      font: inherit;
      font-size: 14px;
    }

    app-login input::placeholder { color: #8c9199; }
    app-login input:focus { border-color: var(--red); outline: none; }

    app-login .password { position: relative; }
    app-login .password input { padding-right: 84px; }

    app-login .password__toggle {
      position: absolute;
      top: 50%;
      right: 16px;
      transform: translateY(-50%);
      border: 0;
      background: none;
      font-size: 13px;
      font-weight: 500;
      color: #2b2f36;
    }
    app-login .password__toggle:hover { color: var(--red); }

    /* Botão */
    app-login .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 48px;
      margin-top: 20px;
      border: 0;
      border-radius: 999px;
      background: var(--red);
      color: var(--white);
      font-size: 15px;
      font-weight: 600;
      transition: background-color 0.2s ease;
    }
    app-login .btn:hover { background: var(--red-hover); }

    /* Responsivo */
    @media (max-width: 900px) {
      app-login .login { grid-template-columns: 1fr; }
      app-login .login__image { display: none; }
      app-login .login__panel { padding: 40px 24px; }
      app-login h1 { font-size: 30px; }
    }

    @media (prefers-reduced-motion: reduce) {
      app-login .btn { transition: none; }
    }
  </style>
</head>
<body>

  <app-login>
    <main class="login">
      <div class="login__image">
        <img src="assets/SalaBranca.png" alt="Ambiente com móveis sob medida em madeira">
      </div>
      <section class="login__panel">
        <div class="login__box">
          <a href="#/" class="back">‹ Voltar ao site</a>
          <h1>Bem-vindo de volta!</h1>
          <p class="login__sub">Entre com seus dados para acessar sua conta.</p>
          
          <form class="form" id="login-form" novalidate>
            <div class="field">
              <label for="email">E-mail</label>
              <input type="email" id="email" name="email" placeholder="seu@email.com" autocomplete="email" required>
              <small class="erro" data-error="email" hidden></small>
            </div>

            <div class="field">
              <div class="field__row">
                <label for="senha">Senha</label>
                <a href="#" data-action="forgot-password" class="esqueci-senha-link">Esqueci minha senha</a>
              </div>
              <div class="password">
                <input type="password" id="senha" name="senha" placeholder="••••••••" autocomplete="current-password" required>
                <button type="button" class="password__toggle" data-action="toggle-login-password">Mostrar</button>
              </div>
              <small class="erro" data-error="senha" hidden></small>
            </div>

            <button type="submit" class="btn">Entrar na minha conta</button>
            
            <p class="demo-note">Demonstração local: use um e-mail válido e qualquer senha.</p>
            <p class="mensagem_sucesso" role="status" hidden></p>
            <p class="erro" role="alert" data-error="form" hidden></p>
          </form>
        </div>
      </section>
    </main>
  </app-login>

</body>
</html>
